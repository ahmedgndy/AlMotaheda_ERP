# The API and a SQL Server, for a trial run or a small Linux server.
#
#   cp deploy/.env.example deploy/.env      # then fill in deploy/.env
#   docker compose -f deploy/compose.yaml up -d --build
#
# The API answers on http://localhost:${API_PORT:-8080}. See deploy/README.md.

name: almotaheda-erp

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Express}
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in deploy/.env}
    volumes:
      - sql-data:/var/opt/mssql
    # Only bound to this machine, on a port that does not clash with a SQL Server already on 1433.
    ports:
      - "127.0.0.1:${SQL_PORT:-14333}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-almotaheda-erp-api:local}
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Erp: "Server=db,1433;Database=${SQL_DATABASE:-AlMotahedaErp};User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=true"
      Access__Tokens__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in deploy/.env}
      # Only for the very first start with an empty database; remove both afterwards.
      Access__Bootstrap__Email: ${BOOTSTRAP_EMAIL:-}
      Access__Bootstrap__Password: ${BOOTSTRAP_PASSWORD:-}
      # true creates the tables on start. Fine for a trial; on a real server apply the reviewed scripts instead.
      Database__ApplyMigrationsOnStartup: ${APPLY_MIGRATIONS_ON_STARTUP:-false}
      ApiDocumentation__Enabled: ${SWAGGER_ENABLED:-false}
      Projects__TimeZone: ${COMPANY_TIME_ZONE:-Africa/Cairo}
    volumes:
      - archive-data:/data/archive
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  sql-data:
  archive-data:
